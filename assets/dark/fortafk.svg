<svg width="420" height="400" viewBox="0 0 420 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="fortAFK: a macro recorder that watches the screen">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
    .in{opacity:0;animation:up .6s cubic-bezier(.16,1,.3,1) forwards}
    .pop{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:pop .5s cubic-bezier(.16,1,.3,1) forwards}
    .dr{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.2s cubic-bezier(.65,0,.35,1) forwards}
    .r{opacity:0;animation:cycle 12s ease-in-out infinite}.r1{animation-delay:4s}.r2{animation-delay:8s}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.pop{opacity:1;transform:none}.dr{stroke-dashoffset:0}.r{opacity:0}.r0{opacity:1}}
    @keyframes lock{0%{transform:scale(4.2);opacity:0}15%{opacity:1}55%,100%{transform:scale(1);opacity:1}}
    @keyframes blink{0%,60%{opacity:0}62%,100%{opacity:1}}
    @keyframes ripple{0%,70%{r:0;opacity:0}72%{opacity:1}100%{r:22;opacity:0}}
    .lk{transform-box:fill-box;transform-origin:center;animation:lock 3.2s cubic-bezier(.16,1,.3,1) infinite}
    .bl{animation:blink 3.2s linear infinite}
    .rp{animation:ripple 3.2s ease-out infinite}</style>
<defs>
  <pattern id="htf" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="5" cy="5" r="2.3" fill="#ececee"/></pattern>
  <linearGradient id="fdf" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
  <linearGradient id="fdrf" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="mf"><rect width="420" height="400" fill="url(#fdf)"/></mask>
  <mask id="mrf"><rect width="420" height="400" fill="url(#fdrf)"/></mask>
  <marker id="arf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ececee"/></marker>
  <clipPath id="cpf"><rect x="6" y="6" width="408" height="388" rx="4"/></clipPath>
</defs>
<rect x="3" y="3" width="414" height="394" rx="6" fill="#16171a"/>
<rect x="40" y="196" width="340" height="146" rx="8" fill="#16171a" stroke="#ececee" stroke-width="4"/>
<g clip-path="url(#cpf)"><clipPath id="scr"><rect x="44" y="200" width="332" height="138" rx="5"/></clipPath>
<g clip-path="url(#scr)"><g mask="url(#mrf)" opacity=".55"><rect x="40" y="196" width="340" height="90" fill="url(#htf)"/></g>
<path d="M44 310 L110 286 L160 300 L220 272 L270 290 L330 276 L376 296 V338 H44Z" fill="#ececee" fill-opacity=".14" stroke="#ececee" stroke-width="2.5"/>
<path d="M288 272 L300 250 L312 272Z" fill="#ececee"/></g></g>
<g class="lk" fill="none" stroke="#ececee" stroke-width="4" stroke-linecap="round"><path d="M274 248v-12h12"/><path d="M314 236h12v12"/><path d="M326 276v12h-12"/><path d="M286 288h-12v-12"/></g>
<g class="bl"><g transform="translate(308 268) scale(1.0833)" fill="none" stroke="#ececee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 7.5-6.2 1.7L10 18.5z"/></g></g>
<circle class="rp" cx="310" cy="270" r="0" stroke="#ececee" stroke-width="2.5"/>
<path d="M190 342 v22 M230 342 v22 M160 368 h100" stroke="#ececee" stroke-width="4" stroke-linecap="round"/>
<g class="in" style="animation-delay:0.05s">
<rect x="22" y="22" width="376" height="163" fill="#16171a" stroke="#ececee" stroke-width="3.5"/>
<text x="40" y="65" font-size="29" font-weight="800" fill="#ececee">fortAFK</text>
<text x="40" y="97" font-size="21" fill="#a0a2ab">A macro recorder that</text>
<text x="40" y="125" font-size="21" fill="#a0a2ab">watches the screen.</text>
