<svg width="420" height="400" viewBox="0 0 420 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hobbies: side projects I build for fun, around games.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
    .in{opacity:0;animation:up .6s cubic-bezier(.16,1,.3,1) forwards}
    .pop{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:pop .5s cubic-bezier(.16,1,.3,1) forwards}
    .dr{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.2s cubic-bezier(.65,0,.35,1) forwards}
    .r{opacity:0;animation:cycle 12s ease-in-out infinite}.r1{animation-delay:4s}.r2{animation-delay:8s}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.pop{opacity:1;transform:none}.dr{stroke-dashoffset:0}.r{opacity:0}.r0{opacity:1}}</style>
<defs>
  <pattern id="hth" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="5" cy="5" r="2.3" fill="#ececee"/></pattern>
  <linearGradient id="fdh" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
  <linearGradient id="fdrh" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="mh"><rect width="420" height="400" fill="url(#fdh)"/></mask>
  <mask id="mrh"><rect width="420" height="400" fill="url(#fdrh)"/></mask>
  <marker id="arh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ececee"/></marker>
  <clipPath id="cph"><rect x="6" y="6" width="408" height="388" rx="4"/></clipPath>
</defs>
<rect x="3" y="3" width="414" height="394" rx="6" fill="#16171a"/><g clip-path="url(#cph)"><g mask="url(#mh)" opacity=".8"><rect x="0" y="190" width="420" height="210" fill="url(#hth)"/></g></g>
<g class="in" style="animation-delay:0.05s">
<rect x="22" y="22" width="376" height="119" fill="#16171a" stroke="#ececee" stroke-width="3.5"/>
<text x="40" y="65" font-size="29" font-weight="800" fill="#ececee">Hobbies</text>
<text x="40" y="97" font-size="21" fill="#a0a2ab">Side projects I build</text>
<text x="40" y="125" font-size="21" fill="#a0a2ab">for fun, around games.</text>
</g>
<g class="in" style="animation-delay:0.30s"><rect x="120" y="214" width="180" height="150" rx="10" fill="#16171a" stroke="#ececee" stroke-width="4"/>
<g transform="translate(138 216) scale(6.0000)" fill="none" stroke="#ececee" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h10a4 4 0 0 1 4 4.4l-.5 4.1a2.3 2.3 0 0 1-4 1.2L14.8 16H9.2l-1.7 1.7a2.3 2.3 0 0 1-4-1.2L3 12.4A4 4 0 0 1 7 8z"/><path d="M7.5 11v3M6 12.5h3M15.5 12h.01M17.5 14h.01"/></g></g><rect x="3" y="3" width="414" height="394" rx="6" stroke="#ececee" stroke-width="5"/>
</svg>
