<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Juliano, @Arkhm, software engineer in Brazil. I build full-stack apps, web and mobile. I get AI coding agents to work as a team. I write tools that read the screen and act.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
    .in{opacity:0;animation:up .6s cubic-bezier(.16,1,.3,1) forwards}
    .pop{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:pop .5s cubic-bezier(.16,1,.3,1) forwards}
    .dr{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.2s cubic-bezier(.65,0,.35,1) forwards}
    .r{opacity:0;animation:cycle 12s ease-in-out infinite}.r1{animation-delay:4s}.r2{animation-delay:8s}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.pop{opacity:1;transform:none}.dr{stroke-dashoffset:0}.r{opacity:0}.r0{opacity:1}}@media (prefers-color-scheme:dark){[fill="#141518"]{fill:#ececee}[stroke="#141518"]{stroke:#ececee}[stop-color="#141518"]{stop-color:#ececee}[fill="#fcfcfc"]{fill:#16171a}[stroke="#fcfcfc"]{stroke:#16171a}[stop-color="#fcfcfc"]{stop-color:#16171a}[fill="#ffffff"]{fill:#0f1012}[stroke="#ffffff"]{stroke:#0f1012}[stop-color="#ffffff"]{stop-color:#0f1012}[fill="#55575f"]{fill:#a0a2ab}[stroke="#55575f"]{stroke:#a0a2ab}[stop-color="#55575f"]{stop-color:#a0a2ab}}</style>
<defs>
  <pattern id="gdb" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.3" fill="#141518" fill-opacity=".22"/></pattern>
  <pattern id="hxb" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#141518" stroke-width="1.6" stroke-opacity=".6"/></pattern>
  <linearGradient id="vgb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity=".25"/></linearGradient>
  <mask id="vmb"><rect width="1280" height="400" fill="url(#vgb)"/></mask>
  <marker id="tab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 9 5 0 9" fill="none" stroke="#141518" stroke-width="1.6"/></marker>
</defs>
<rect width="1280" height="400" rx="8" fill="#fcfcfc"/>
<rect width="1280" height="400" fill="url(#gdb)" mask="url(#vmb)"/>
<rect x="10" y="10" width="1260" height="380" stroke="#141518" stroke-width="2.5"/>
<rect x="18" y="18" width="1244" height="364" stroke="#141518" stroke-width="1" stroke-opacity=".5"/>
<g stroke="#141518" fill="none">
  <circle class="dr" style="animation-delay:0.30s" cx="1010" cy="200" r="130" stroke-width="2.2"/>
  <circle class="in" style="animation-delay:0.60s" cx="1010" cy="200" r="78" stroke-width="1.4" stroke-dasharray="6 6"/>
  <path class="dr" style="animation-delay:0.50s" d="M840 200H1180M1010 30V370" stroke-width="1.2" stroke-opacity=".6"/>
  <path class="dr" style="animation-delay:0.90s" d="M1010 70 L1123 265 L897 265 Z" stroke-width="2.2"/>
  <path class="dr" style="animation-delay:1.20s" d="M880 360 H1140" stroke-width="1.4" marker-start="url(#tab)" marker-end="url(#tab)"/>
  <path d="M880 350v20M1140 350v20" stroke-width="1.4"/>
</g>
<g class="in" style="animation-delay:1.00s"><circle cx="1010" cy="70" r="26" fill="#fcfcfc" stroke="#141518" stroke-width="2.2"/></g><g class="in" style="animation-delay:1.15s"><circle cx="1123" cy="265" r="26" fill="#fcfcfc" stroke="#141518" stroke-width="2.2"/></g><g class="in" style="animation-delay:1.30s"><circle cx="897" cy="265" r="26" fill="#fcfcfc" stroke="#141518" stroke-width="2.2"/></g>
<g class="in" style="animation-delay:1.50s"><rect x="940" y="347" width="140" height="26" fill="#fcfcfc"/><text x="1010" y="367" text-anchor="middle" font-size="18" font-style="italic" fill="#55575f">one task</text></g>
<text x="66" y="186" class="in" font-size="132" font-weight="800" letter-spacing="-3" fill="#141518">Juliano</text>
<path class="dr" style="animation-delay:0.30s" d="M70 214 H700" stroke="#141518" stroke-width="2.2"/>
<text x="70" y="262" class="r r0" font-size="29" font-weight="600" fill="#141518">I build full-stack apps, web and mobile.</text><text x="70" y="262" class="r r1" font-size="29" font-weight="600" fill="#141518">I get AI coding agents to work as a team.</text><text x="70" y="262" class="r r2" font-size="29" font-weight="600" fill="#141518">I write tools that read the screen and act.</text>
<text x="70" y="330" class="in" style="animation-delay:0.40s" font-size="23" fill="#55575f">@Arkhm, software engineer in Brazil</text>

</svg>
