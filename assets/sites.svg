<svg width="640" height="400" viewBox="0 0 640 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Client sites (private repos): fast static sites for small businesses">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
    .in{opacity:0;animation:up .6s cubic-bezier(.16,1,.3,1) forwards}
    .pop{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:pop .5s cubic-bezier(.16,1,.3,1) forwards}
    .dr{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.2s cubic-bezier(.65,0,.35,1) forwards}
    .r{opacity:0;animation:cycle 12s ease-in-out infinite}.r1{animation-delay:4s}.r2{animation-delay:8s}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.pop{opacity:1;transform:none}.dr{stroke-dashoffset:0}.r{opacity:0}.r0{opacity:1}}
    @keyframes build{0%{opacity:0;transform:translateY(8px)}6%{opacity:1;transform:none}78%{opacity:1}88%,100%{opacity:0}}
    @keyframes load{0%{transform:scaleX(0);opacity:1}10%{transform:scaleX(1);opacity:1}16%,100%{transform:scaleX(1);opacity:0}}
    .bl{animation:build 6s cubic-bezier(.16,1,.3,1) infinite both}
    .ld{transform-box:fill-box;transform-origin:left;animation:load 6s ease-out infinite both}
    @media (prefers-reduced-motion:reduce){.ld{opacity:0}}@media (prefers-color-scheme:dark){[fill="#141518"]{fill:#ececee}[stroke="#141518"]{stroke:#ececee}[stop-color="#141518"]{stop-color:#ececee}[fill="#fcfcfc"]{fill:#16171a}[stroke="#fcfcfc"]{stroke:#16171a}[stop-color="#fcfcfc"]{stop-color:#16171a}[fill="#ffffff"]{fill:#0f1012}[stroke="#ffffff"]{stroke:#0f1012}[stop-color="#ffffff"]{stop-color:#0f1012}[fill="#55575f"]{fill:#a0a2ab}[stroke="#55575f"]{stroke:#a0a2ab}[stop-color="#55575f"]{stop-color:#a0a2ab}}</style>
<defs>
  <pattern id="htc" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="5" cy="5" r="2.3" fill="#141518"/></pattern>
  <linearGradient id="fdc" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
  <linearGradient id="fdrc" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="mc"><rect width="640" height="400" fill="url(#fdc)"/></mask>
  <mask id="mrc"><rect width="640" height="400" fill="url(#fdrc)"/></mask>
  <marker id="arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#141518"/></marker>
  <clipPath id="cpc"><rect x="6" y="6" width="628" height="388" rx="4"/></clipPath>
</defs>
<rect x="3" y="3" width="634" height="394" rx="6" fill="#fcfcfc"/><g clip-path="url(#cpc)"><g mask="url(#mc)" opacity=".6"><rect x="0" y="240" width="330" height="160" fill="url(#htc)"/></g></g>
