<svg width="640" height="400" viewBox="0 0 640 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kiosk POS (private repo): sales, stock and cash for a small kiosk">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
    .in{opacity:0;animation:up .6s cubic-bezier(.16,1,.3,1) forwards}
    .pop{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:pop .5s cubic-bezier(.16,1,.3,1) forwards}
    .dr{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.2s cubic-bezier(.65,0,.35,1) forwards}
    .r{opacity:0;animation:cycle 12s ease-in-out infinite}.r1{animation-delay:4s}.r2{animation-delay:8s}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.pop{opacity:1;transform:none}.dr{stroke-dashoffset:0}.r{opacity:0}.r0{opacity:1}}
    @keyframes print{0%{transform:translateY(-270px);opacity:1}45%{transform:none}82%{transform:none;opacity:1}92%{transform:translateY(30px);opacity:0}100%{transform:translateY(-270px);opacity:0}}
    @keyframes led{0%,44%{opacity:1}2%,6%,10%,14%,18%,22%,26%,30%,34%,38%,42%{opacity:.15}46%,100%{opacity:1}}
    .pr{animation:print 6s cubic-bezier(.45,0,.2,1) infinite}
    .led{animation:led 6s linear infinite}</style>
<defs>
  <pattern id="htk" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="5" cy="5" r="2.3" fill="#141518"/></pattern>
  <linearGradient id="fdk" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
  <linearGradient id="fdrk" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="mk"><rect width="640" height="400" fill="url(#fdk)"/></mask>
  <mask id="mrk"><rect width="640" height="400" fill="url(#fdrk)"/></mask>
  <marker id="ark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#141518"/></marker>
  <clipPath id="cpk"><rect x="6" y="6" width="628" height="388" rx="4"/></clipPath>
</defs>
<rect x="3" y="3" width="634" height="394" rx="6" fill="#fcfcfc"/><g clip-path="url(#cpk)"><g mask="url(#mk)" opacity=".6"><rect x="0" y="240" width="340" height="160" fill="url(#htk)"/></g></g>
<clipPath id="slot"><rect x="360" y="98" width="240" height="290"/></clipPath>
<g clip-path="url(#slot)"><g class="pr">
