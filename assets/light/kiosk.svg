  <text x="410" y="266" font-size="21" font-weight="800" fill="#141518">TOTAL</text>
  <rect x="500" y="252" width="52" height="12" rx="6" fill="#141518"/><rect x="410" y="300" width="2" height="34" fill="#141518"/><rect x="417" y="300" width="3" height="34" fill="#141518"/><rect x="424" y="300" width="4" height="34" fill="#141518"/><rect x="431" y="300" width="5" height="34" fill="#141518"/><rect x="438" y="300" width="2" height="34" fill="#141518"/><rect x="445" y="300" width="3" height="34" fill="#141518"/><rect x="452" y="300" width="4" height="34" fill="#141518"/><rect x="459" y="300" width="5" height="34" fill="#141518"/><rect x="466" y="300" width="2" height="34" fill="#141518"/><rect x="473" y="300" width="3" height="34" fill="#141518"/><rect x="480" y="300" width="4" height="34" fill="#141518"/><rect x="487" y="300" width="5" height="34" fill="#141518"/><rect x="494" y="300" width="2" height="34" fill="#141518"/><rect x="501" y="300" width="3" height="34" fill="#141518"/><rect x="508" y="300" width="4" height="34" fill="#141518"/><rect x="515" y="300" width="5" height="34" fill="#141518"/><rect x="522" y="300" width="2" height="34" fill="#141518"/><rect x="529" y="300" width="3" height="34" fill="#141518"/><rect x="536" y="300" width="4" height="34" fill="#141518"/><rect x="543" y="300" width="5" height="34" fill="#141518"/></g></g>
